[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazarillo"
version = "0.1.0"
description = "A data harness that guides AI agents through your lakehouse: context, guardrails and verification."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guillermo Vizcaíno Román" }]
requires-python = ">=3.11"
keywords = ["data-engineering", "dbt", "ai-agents", "mcp", "data-diff", "iceberg", "delta-lake", "harness"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]
dependencies = [
  "click>=8.1",
  "duckdb>=1.1",
  "pyarrow>=16",
  "pyyaml>=6",
]

[project.optional-dependencies]
delta = ["deltalake>=0.20"]
iceberg = ["pyiceberg[sql-sqlite,pyarrow]>=0.8"]
s3 = ["boto3>=1.34"]
glue = ["lazarillo[iceberg,s3]", "pyiceberg[glue]>=0.8"]
mcp = ["mcp>=2"]
dbt = ["dbt-duckdb>=1.8"]
all = ["lazarillo[delta,iceberg,glue,dbt,mcp]"]
dev = ["lazarillo[all]", "pytest>=8", "moto[server]>=5"]

[project.scripts]
lazarillo = "lazarillo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lazarillo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["minio: runs against a real S3-compatible server (set LAZARILLO_TEST_S3_ENDPOINT)"]
