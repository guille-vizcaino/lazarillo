[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazarillo"
version = "0.1.0"
description = "A data harness that guides AI agents through your lakehouse: context, guardrails and verification."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guillermo Vizcaíno Román", email = "hi@guille.me" }]
requires-python = ">=3.11"
keywords = ["data-engineering", "dbt", "ai-agents", "mcp", "data-diff", "iceberg", "delta-lake", "redshift", "harness"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "click>=8.1",
  "duckdb>=1.1",
  "pyarrow>=16",
  "pyyaml>=6",
]

[project.optional-dependencies]
delta = ["deltalake>=0.20"]
iceberg = ["pyiceberg[sql-sqlite,pyarrow]>=0.8"]
s3 = ["boto3>=1.34"]
glue = ["lazarillo[iceberg,s3]", "pyiceberg[glue]>=0.8"]
redshift = ["lazarillo[s3]", "psycopg2-binary>=2.9"]
mcp = ["mcp>=2"]
dbt = ["dbt-duckdb>=1.8"]
all = ["lazarillo[delta,iceberg,glue,redshift,dbt,mcp]"]
dev = ["lazarillo[all]", "pytest>=8", "moto[server]>=5"]

[project.urls]
Homepage = "https://github.com/guille-vizcaino/lazarillo"
Documentation = "https://github.com/guille-vizcaino/lazarillo#readme"
Issues = "https://github.com/guille-vizcaino/lazarillo/issues"

[project.scripts]
lazarillo = "lazarillo.cli:main"

[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", ".mcp.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/lazarillo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "minio: runs against a real S3-compatible server (set LAZARILLO_TEST_S3_ENDPOINT)",
  "postgres: runs against Postgres standing in for Redshift (set LAZARILLO_TEST_PG_DSN)",
]
